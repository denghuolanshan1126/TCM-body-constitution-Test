        startTestBtn.addEventListener('click', () => {

            questionnaireSection.classList.remove('hidden');
            loadQuestion(currentQuestionIndex);
            updateProgress();
        });

        // 上一题
        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
                updateProgress();
            }
        });

        // 下一题
        nextBtn.addEventListener('click', () => {
            const selectedOption = document.querySelector('input[name="option"]:checked');
            if (!selectedOption) {
                alert('请选择一个答案后再继续');
                return;
            }

            // 保存答案
            const questionId = questions[currentQuestionIndex].id;
            answers[questionId] = parseInt(selectedOption.value);

            // 下一题
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion(currentQuestionIndex);
                updateProgress();
            } else {
                // 最后一题，显示提交按钮
                calculateScores();
                showResult();
            }
        });

        // 提交结果
        submitBtn.addEventListener('click', () => {
            const selectedOption = document.querySelector('input[name="option"]:checked');
            if (!selectedOption) {
                alert('请选择一个答案后再提交');
                return;
            }

            // 保存最后一题答案
            const questionId = questions[currentQuestionIndex].id;
            answers[questionId] = parseInt(selectedOption.value);

            // 计算得分并显示结果
            calculateScores();
            showResult();
        });

        // 加载题目（保持选项框固定尺寸）
        function loadQuestion(index) {
            const question = questions[index];
            questionNumber.textContent = `第${index + 1}题`;
            questionText.textContent = question.text;

            // 生成选项
            optionsContainer.innerHTML = '';
            const scores = [1, 2, 3, 4, 5];
            const labels = ['根本没有/从不', '很少/偶尔', '有时', '经常', '总是如此'];

            scores.forEach((score, i) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option-box'; // 固定高度和宽度的选项框
                
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'option';
                input.value = score;
                input.id = `option-${score}`;
                input.className = 'mr-3 mt-1 h-4 w-4 text-primary'; // 调整单选框位置
                
                // 如果之前有答案，选中对应的选项
                if (answers[question.id] === score) {
                    input.checked = true;
                }
                
                const label = document.createElement('label');
                label.htmlFor = `option-${score}`;
                label.className = 'option-label'; // 文字自动换行
                label.textContent = `${score}分：${labels[i]}`;
                
                optionDiv.appendChild(input);
                optionDiv.appendChild(label);
                optionsContainer.appendChild(optionDiv);
            });

            // 更新按钮状态
            if (index === 0) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }

            if (index === questions.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        // 更新进度条
        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        // 计算体质得分
        function calculateScores() {
            // 重置得分
            Object.keys(constitutionScores).forEach(key => constitutionScores[key] = 0);

            // 计算各体质原始分
            questions.forEach(question => {
                const score = answers[question.id];
                if (score === undefined) return;

                // 反向计分处理
                let finalScore = score;
                if (question.id === 'A1' || question.id === 'A2') {
                    // 平和质反向计分：1→5，2→4，3→3，4→2，5→1
                    finalScore = 6 - score;
                } else if (question.id === 'X3') {
                    // 记忆力反向计分
                    finalScore = 6 - score;
                }

                constitutionScores[question.type] += finalScore;
            });
        }

        // 显示结果（保持居中排版）
        function showResult() {
            questionnaireSection.classList.add('hidden');
            resultSection.classList.remove('hidden');

            // 计算转化分并判定体质
            const constitutionResults = {};
            let mainConstitutions = [];
            let pingheScore = 0;

            Object.keys(constitutionScores).forEach(type => {
                const rawScore = constitutionScores[type];
                const questionCount = constitutionQuestionCount[type];
                // 转化分 = (原始分 - 题目数) / (题目数 × 4) × 100
                const convertedScore = Math.round(((rawScore - questionCount) / (questionCount * 4)) * 100);
                constitutionResults[type] = {
                    rawScore,
                    convertedScore,
                    isMain: false
                };

                // 平和质判定
                if (type === '平和质') {
                    pingheScore = convertedScore;
                }
            });

            // 判定体质类型
            let isPinghe = false;
            if (pingheScore >= 60) {
                let allOtherLow = true;
                Object.keys(constitutionResults).forEach(type => {
                    if (type !== '平和质' && constitutionResults[type].convertedScore >= 30) {
                        allOtherLow = false;
                    }
                });
                if (allOtherLow) {
                    isPinghe = true;
                    mainConstitutions.push('平和质');
                    constitutionResults['平和质'].isMain = true;
                }
            }

            // 偏颇体质判定
            if (!isPinghe) {
                Object.keys(constitutionResults).forEach(type => {
                    if (type !== '平和质' && constitutionResults[type].convertedScore >= 40) {
                        mainConstitutions.push(type);
                        constitutionResults[type].isMain = true;
                    }
                });

                // 如果没有主要体质，找倾向体质
                if (mainConstitutions.length === 0) {
                    Object.keys(constitutionResults).forEach(type => {
                        if (type !== '平和质' && constitutionResults[type].convertedScore >= 30) {
                            mainConstitutions.push(type);
                            constitutionResults[type].isMain = true;
                        }
                    });
                }

                // 如果还是没有，默认平和质倾向
                if (mainConstitutions.length === 0) {
                    mainConstitutions.push('平和质（倾向）');
                    constitutionResults['平和质'].isMain = true;
                }
            }

            // 生成结果摘要
            if (mainConstitutions.length === 1) {
                resultSummary.innerHTML = `您的主要体质类型为：<span class="text-primary font-bold">${mainConstitutions[0]}</span>`;
            } else {
                resultSummary.innerHTML = `您的体质为兼夹体质，主要类型为：<span class="text-primary font-bold">${mainConstitutions.join('、')}</span>`;
            }

            // 生成体质详情
            constitutionDetails.innerHTML = '';
            Object.keys(constitutionResults).forEach(type => {
                const result = constitutionResults[type];
                const intro = constitutionIntro[type];

                const detailDiv = document.createElement('div');
                detailDiv.className = `${result.isMain ? 'border-2 border-primary' : 'border border-secondary/30'} rounded-lg p-4 bg-light/50 mx-auto max-w-sm`;

                const title = document.createElement('h3');
                title.className = `text-[clamp(1rem,3vw,1.2rem)] font-kai font-bold ${result.isMain ? 'text-primary' : 'text-dark/80'} mb-2 text-center`;
                title.textContent = `${type}（转化分：${result.convertedScore}分）`;

                const scoreDesc = document.createElement('p');
                scoreDesc.className = 'mb-3 text-xs md:text-sm italic text-center';
                if (type === '平和质') {
                    scoreDesc.textContent = result.convertedScore >= 60 ? '体质平和，健康状态良好' : '体质倾向平和，但仍有偏颇';
                } else if (result.convertedScore >= 40) {
                    scoreDesc.textContent = '属于该体质类型（明显偏颇）';
                } else if (result.convertedScore >= 30) {
                    scoreDesc.textContent = '倾向该体质类型（轻度偏颇）';
                } else {
                    scoreDesc.textContent = '不属于该体质类型';
                }

                const introTitle = document.createElement('h4');
                introTitle.className = 'font-kai font-bold text-dark/90 mb-1 text-sm md:text-base text-center';
                introTitle.textContent = '体质介绍：';

                const introContent = document.createElement('p');
                introContent.className = 'mb-3 leading-relaxed text-sm md:text-base text-wrap text-center';
                introContent.textContent = intro.介绍;

                const featureTitle = document.createElement('h4');
                featureTitle.className = 'font-kai font-bold text-dark/90 mb-1 text-sm md:text-base text-center';
                featureTitle.textContent = '主要特征：';

                const featureContent = document.createElement('p');
                featureContent.className = 'leading-relaxed text-sm md:text-base text-wrap text-center';
                featureContent.textContent = intro.特征;

                detailDiv.appendChild(title);
                detailDiv.appendChild(scoreDesc);
                detailDiv.appendChild(introTitle);
                detailDiv.appendChild(introContent);
                detailDiv.appendChild(featureTitle);
                detailDiv.appendChild(featureContent);

                constitutionDetails.appendChild(detailDiv);
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化背景效果
            const bgOverlay = document.querySelectorAll('.bg-overlay');
            bgOverlay.forEach(el => {
                el.classList.add('transition-all', 'duration-700');
            });
        });
    </script>
</body>

</html>
